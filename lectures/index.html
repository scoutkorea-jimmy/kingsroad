<script>
  // 등록되어 있을 수 있는 모든 Service Worker 즉시 해제 — 옛 캐시가 새 빌드를 가리는 일을 방지.
  (function () {
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => { try { r.unregister(); } catch {} });
        }).catch(() => {});
      }
      // CacheStorage(=Cache API) 도 마이그레이션 시점에 한 번 비움.
      if (typeof caches !== 'undefined' && caches.keys) {
        caches.keys().then((keys) => {
          keys.forEach((k) => { try { caches.delete(k); } catch {} });
        }).catch(() => {});
      }
    } catch {}
  })();
  // SPA fallback 복원 — 404.html이 ?p=/community 같은 형태로 리다이렉트시켰으면
  // 진짜 경로를 복원해 클라이언트 라우터가 인식하게 한다.
  (function () {
    try {
      var url = new URL(location.href);
      var p = url.searchParams.get('p');
      if (p) {
        history.replaceState(null, '', p);
      }
    } catch {}
  })();
  // v00.306.008 — 글 목록을 **번들보다 먼저** 물어본다.
  //
  // 실측(광장 첫 진입): 첫 화면 1.3초 · 글 목록 2.6초. 요청 자체는 0.5초인데
  // **요청이 1.26초에야 시작**했다 — 1MB 번들을 받아 React 가 뜬 뒤에야 물어보기 때문이다.
  // 기다리는 시간의 절반이 '아직 묻지도 않은' 시간이었다.
  //
  // 여기서 미리 던져 두면 번들을 받는 동안 서버가 일을 한다. data.js 의 refreshPosts 가
  // 이 약속을 그대로 집어 쓴다(다시 묻지 않는다).
  //
  // ⚠ 인증을 api.js 와 **똑같이** 맞춰야 한다. 안 그러면 관리자가 못 보는 글이 생긴다
  //   — 쿠키(credentials) + localStorage 토큰(Authorization) 둘 다.
  // ⚠ 주소가 api.js 의 BASE 와 두 벌이 된다 — smoke 가 두 값이 같은지 검사한다.
  (function () {
    try {
      // 글 목록을 쓰는 화면에서만. 칼럼·도서 페이지에서까지 부르면 그냥 낭비다.
      var path = location.pathname;
      if (!(path === '/' || path === '/community' || path.indexOf('/community/') === 0)) return;
      var h = { Accept: 'application/json' };
      try {
        var t = localStorage.getItem('bgnj_session_token');
        if (t) h.Authorization = 'Bearer ' + t;
      } catch (e) {}
      window.__BGNJ_PRELOAD = {
        at: Date.now(),
        posts: fetch('https://api.bgnj.net/api/posts?limit=1000', { credentials: 'include', headers: h })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; }),
      };
    } catch (e) {}
  })();
  // 조건부 HTTPS 강제 (v00.064) — SSL 도입 후 콘솔에서 opt-in:
  //   localStorage.setItem('bgnj_force_https', '1')
  // 활성화 시 http:// 진입을 즉시 https:// 로 redirect. SSL 미도입 환경에서 활성화 금지 (사이트 접속 불가).
  (function () {
    try {
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        if (localStorage.getItem('bgnj_force_https') === '1') {
          location.replace('https://' + location.host + location.pathname + location.search + location.hash);
        }
      }
    } catch {}
  })();
</script>
